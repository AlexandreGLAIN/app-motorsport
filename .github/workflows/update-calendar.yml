name: Actualiser et publier le calendrier

# Une passe par jour à 04:00 UTC (06:00 à Paris l'été, 05:00 l'hiver) : les
# horaires officiels bougent surtout en semaine, une actualisation quotidienne
# suffit largement et reste très légère pour les sources.
on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Le site est publié en poussant le dossier compilé sur la branche `gh-pages`,
# que GitHub Pages sert directement. On n'utilise pas `actions/deploy-pages` :
# ce mécanisme exige que la source Pages soit « GitHub Actions », ce qui interdit
# toute publication manuelle. Avec une branche, le site peut être republié depuis
# n'importe quelle machine (`npm run ci` puis push) si Actions est indisponible.
permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le calendrier versionné sert de filet : si une source est indisponible,
      # le pipeline reprend ses sessions au lieu de les faire disparaître.
      - name: Récupérer les horaires
        run: npm run ingest

      - name: Committer le calendrier s'il a changé
        run: |
          if git diff --quiet -- public/data/calendar.json; then
            echo "Aucun changement dans le calendrier."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/calendar.json
            git commit -m "chore(data): actualisation quotidienne du calendrier"
            git push
          fi

      # GitHub Pages sert le site sous /<nom-du-depot>/ : sans ce préfixe, les
      # ressources seraient cherchées à la racine du domaine et renverraient 404.
      - name: Construire le site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # `gh-pages` ne contient que le résultat de la compilation. Son historique
      # n'a aucune valeur : on le réécrit à chaque passe pour que le dépôt ne
      # grossisse pas d'un jeu de fichiers compilés par jour.
      - name: Publier sur la branche gh-pages
        working-directory: dist
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier le site — ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
